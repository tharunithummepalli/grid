<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display:grid; 
            grid-template-columns: repeat(5 , 1fr);
            row-gap: 20px;
            column-gap: 20px;
            height: 90vh;
            margin: 25px;
        }
        .child1{
            background-color: aqua;
        }
        .child2{
            background-color: lawngreen;
        }
        .child3{
            background-color: mediumorchid;
        }
        .child4{
            background-color: hotpink;
        }
        .child5{
            background-color: firebrick;
        }
        .child6{
            background-color: coral;
        }
        .child7{
            background-color: cornflowerblue;
        }
        .child8{
            background-color: navy;
            grid-column: 3/6;
        }
        .child9{
            background-color: brown;
            grid-column: 1/6;
        }
    </style>
</head>
<body>
    <a href="./index.html">HOME</a>
    <div class="parent">
        <div class="child1">s</div>
        <div class="child2">h</div>
        <div class="child3">i</div>
        <div class="child4">n</div>
        <div class="child5">c</div>
        <div class="child6">h</div>
        <div class="child7">a</div>
        <div class="child8">n</div>
        <div class="child9">.</div>
    </div>
</body>
</html>
