<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display:grid; 
            grid-template-columns: repeat(3 , 1fr);
            row-gap: 20px;
            column-gap: 20px;
            height: 90vh;
            margin: 25px;
        }
        .child1{
            background-color: aqua;
            grid-column: 1/4;
        }
        .child2{
            background-color: lawngreen;
            grid-row: 2/4;
        }
        .child3{
            background-color: mediumorchid;
            grid-column: 2/4;
        }
        .child4{
            background-color: hotpink;
        }
        .child5{
            background-color: firebrick;
        }
    </style>
</head>
<body>
    <a href="./index.html">HOME</a>
    <div class="parent">
        <div class="child1">s</div>
        <div class="child2">h</div>
        <div class="child3">i</div>
        <div class="child4">n</div>
        <div class="child5">c</div>
    </div>
</body>
</html>
