<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display: grid;
            height: 90vh;
            grid-template-columns: repeat(4 , 1fr);
            column-gap: 20px;
            row-gap: 20px;
            margin: 20px;
            
        }
        .child1{
               background-color: red;
               grid-column: 1/3;
        }
        .child2{
            background-color: peru;

            
        }
        .child3{
            background-color: lightgreen;
            
        }
        .child4{
            background-color: green;
            
        }
        .child5{
               background-color: red;    
        }
        .child6{
            background-color: peru;
        }
        .child7{
            background-color: lightgreen; 
            grid-column: 1/3; 
            grid-row: 3/5;
        }
        .child8{
            background-color: green; 
            grid-column: 3/4; 
        }
        .child9{
               background-color: red;     
        }
        .child10{
            background-color: peru;  
        }
        .child11{
            background-color: lightgreen;
            grid-column: 1/4;
        }
        .child12{
            background-color: green;  
        }
    </style>
</head>
<body>
    <a href="./index.html">HOME</a>
    <div class="parent">
        <div class="child1">1 </div>
        <div class="child2">2 </div>
        <div class="child3"> 3</div>
        <div class="child4">4 </div>
        <div class="child5">5 </div>
        <div class="child6">6 </div>
        <div class="child7">7 </div>
        <div class="child8">8 </div>
        <div class="child9">9 </div>
        <div class="child10">10 </div>
        <div class="child11">11 </div>
        <div class="child12">12 </div>
    </div>
</body>
</html>
