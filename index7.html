<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     .parent{
        display:grid; 
        grid-template-columns: repeat(4 , 1fr);
        grid-template-rows: 1fr 3fr;
        row-gap: 20px;
        column-gap: 20px;
        height: 90vh;
     }
     .child1{
        background-color: lightblue;
        grid-column: 1/3;
     }
     .child2{
        background-color: lightsalmon;
        grid-column: 3/5;
        
     }
     .child3{
        background-color: lightgreen;
        grid-column: 1/3;
        grid-row: 2/3;
       
     }
     .child4{
        background-color: aqua;
        display: grid; 
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        padding: 20px;
     }
     .sub1{
        background-color: yellow;
        grid-column: 1/3;
     }
     .sub2{
        background-color: violet;
     }
     .sub3{
        background-color: crimson;
     }
    </style>
</head>
<body>
   <a href="./index.html">HOME</a>
    <div class="parent">
        <div class="child1">t</div>
        <div class="child2">h</div>
        <div class="child3">a</div>
            <div class="child4">
                <div class="sub1">u</div>
            <div class="sub2">u</div>
            <div class="sub3">u</div>
            </div>
            
        
    </div>
</body>
</html>
